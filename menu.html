<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Menu — Irmãos Hartmann</title>
<style>
  :root{
    --bg:#0f172a;         
    --card:#111827;       
    --text:#e5e7eb;       
    --muted:#9ca3af;
    --border:#2c3448;
    --green:#10f7a0;      
    --blue:#0ea5e9;       
    --orange:#f59e0b;     
    --purple:#a855f7;     
  }

  *{box-sizing:border-box; margin:0; padding:0}

  html,body{
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:system-ui,Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
  }

  .wrap{
    max-width:760px;
    width:100%;
    padding:20px;
  }

  .logo{
    display:block;
    margin:0 auto 24px;
    max-width:360px;
    width:80%;
    height:auto;
    filter:drop-shadow(0 10px 30px rgba(0,0,0,.35));
  }

  .card{
    background:var(--card);
    border-radius:18px;
    padding:24px;
    box-shadow:0 16px 40px rgba(0,0,0,.45);
    text-align:center;
  }

  /* GRID COM 2 BOTÕES POR LINHA */
  .grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
    max-width:600px;
    margin:0 auto;
  }

  .btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
    height:64px;
    border-radius:14px;
    font-weight:800;
    font-size:18px;
    letter-spacing:.3px;
    border:0;
    text-decoration:none;
    cursor:pointer;
    user-select:none;
    box-shadow:inset 0 -2px rgba(0,0,0,.15);
    transition:0.2s ease-in-out;
  }

  .btn:hover{ transform:scale(1.04); }

  .btn-green{background:var(--green);color:#001c14}
  .btn-blue{background:var(--blue);color:#001018}
  .btn-orange{background:var(--orange);color:#2b1500}
  .btn-purple{background:var(--purple);color:#190029}
  .btn-outline{background:transparent;color:var(--text);border:2px solid var(--border)}

  .footer{
    color:var(--muted);
    font-size:12px;
    text-align:center;
    margin-top:16px;
  }

  @media(max-width:500px){
    .grid{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="img/logo-hartmann.png" alt="IRMÃOS HARTMANN">
    <div class="card">
      <div class="grid">
        <!-- Vender -->
        <a class="btn btn-green" href="vendas.html">🛒 Vender</a>

        <!-- Produtos -->
        <a class="btn btn-blue" href="produtos.html">📦 Produtos</a>

        <!-- OS Arquivadas -->
        <a class="btn btn-orange" href="arquivados.html">📂 OS Arquivadas</a>

        <!-- Clientes -->
        <a class="btn btn-purple" href="clientes.html">👥 Clientes</a>

        <!-- Todas as Vendas (NOVO) -->
        <a class="btn btn-outline" href="tvendas.html">🧾 Todas as Vendas</a>
      </div>
      <div class="footer">Mobile • by Josias Santos</div>
    </div>
  </div>
</body>
</html>
