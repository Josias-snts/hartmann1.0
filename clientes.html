<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Clientes — Irmãos Hartmann</title>
<style>
  :root{
    --bg:#0f172a; --card:#111827; --text:#e5e7eb; --muted:#9ca3af;
    --border:#2c3448; --green:#10f7a0; --blue:#0ea5e9; --red:#ef4444;
  }
  body{margin:0;background:var(--bg);color:var(--text);font-family:sans-serif}
  .wrap{max-width:700px;margin:0 auto;padding:20px}
  .title{font-size:20px;font-weight:800;margin-bottom:10px}
  .card{background:var(--card);border-radius:14px;padding:20px}
  label{font-size:14px;color:var(--muted);margin-top:10px;display:block}
  input{
    width:100%;padding:10px;border-radius:10px;border:1px solid var(--border);
    background:#0b1220;color:var(--text);margin-top:5px;margin-bottom:10px;text-transform:uppercase
  }
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn{height:44px;border-radius:10px;font-weight:700;cursor:pointer;border:0}
  .btn-green{background:var(--green);color:#001c14}
  .btn-blue{background:var(--blue);color:#001018}
  .btn-red{background:var(--red);color:#2b0a0a}
  .list{margin-top:20px;display:flex;flex-direction:column;gap:10px}
  .item{background:#0b1220;border:1px solid var(--border);border-radius:10px;padding:12px;
        display:flex;justify-content:space-between;align-items:center}
  .muted{font-size:12px;color:var(--muted)}
  .small-btns{display:flex;gap:6px}
  .small-btn{padding:6px 12px;border-radius:8px;font-weight:700;cursor:pointer;border:0}
</style>
</head>
<body>
<div class="wrap">
  <div class="title">Cadastro de Clientes</div>
  <div class="card">
    <label>Nome *</label>
    <input type="text" id="nome" placeholder="NOME DO CLIENTE">

    <label>Empresa</label>
    <input type="text" id="empresa" placeholder="NOME DA EMPRESA">

    <div style="display:flex;gap:10px;margin-top:10px">
      <button class="btn btn-green" id="salvar">Salvar</button>
      <button class="btn btn-blue" id="novo">Novo</button>
    </div>

    <label>Buscar</label>
    <input type="text" id="busca" placeholder="FILTRAR POR NOME" style="text-transform:none">

    <div id="lista" class="list"></div>
  </div>
</div>

<script>
const $ = s=>document.querySelector(s);
const uid = ()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
let clientes=[]; let editId=null;

function load(){ try{clientes=JSON.parse(localStorage.getItem('clientes')||'[]')}catch{clientes=[]}; if(!Array.isArray(clientes)) clientes=[]; ordenar();}
function save(){ localStorage.setItem('clientes',JSON.stringify(clientes)); }
function ordenar(){ clientes.sort((a,b)=> (a.nome||'').localeCompare((b.nome||''),'pt-BR')); }
function limpar(){ editId=null; $('#nome').value=''; $('#empresa').value=''; $('#nome').focus(); }
function preencher(c){ editId=c.id; $('#nome').value=c.nome||''; $('#empresa').value=c.empresa||''; }

['nome','empresa'].forEach(id=>{
  $('#'+id).addEventListener('input', e=>{
    const pos=e.target.selectionStart;
    e.target.value=e.target.value.toUpperCase();
    e.target.setSelectionRange(pos,pos);
  });
});

function render(){
  const termo=($('#busca').value||'').trim().toUpperCase();
  const box=$('#lista'); box.innerHTML='';
  const data=termo?clientes.filter(c=>(c.nome||'').includes(termo)):clientes;
  if(!data.length){box.innerHTML='<div class="muted">Nenhum cliente cadastrado.</div>';return;}
  for(const c of data){
    const div=document.createElement('div'); div.className='item';
    div.innerHTML=`
      <div>
        <div><b>${c.nome}</b></div>
        <div class="muted">${c.empresa||'—'}</div>
      </div>
      <div class="small-btns">
        <button class="small-btn btn-blue">Editar</button>
        <button class="small-btn btn-red">Excluir</button>
      </div>`;
    const [btnEditar,btnExcluir]=div.querySelectorAll('button');
    btnEditar.onclick=()=>{preencher(c); window.scrollTo({top:0,behavior:'smooth'});}
    btnExcluir.onclick=()=>{ if(!confirm('Excluir este cliente?'))return;
      clientes=clientes.filter(x=>x.id!==c.id); save(); render(); }
    box.appendChild(div);
  }
}

$('#salvar').onclick=()=>{
  const nome=($('#nome').value||'').trim().toUpperCase();
  if(!nome){alert('Informe o NOME.'); return;}
  const registro={id:editId||uid(),nome,empresa:($('#empresa').value||'').trim().toUpperCase()};
  if(editId){ const i=clientes.findIndex(c=>c.id===editId); if(i>=0) clientes[i]={...clientes[i],...registro}; }
  else{clientes.push(registro);}
  ordenar(); save(); render(); limpar();
};
$('#novo').onclick=()=>limpar();
$('#busca').addEventListener('input',render);

load(); render();
</script>
</body>
</html>
