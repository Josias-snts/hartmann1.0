<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>OS Arquivadas — Irmãos Hartmann</title>
<style>
  :root{
    --bg:#0f172a; --card:#111827; --text:#e5e7eb; --muted:#9ca3af;
    --border:#2c3448; --green:#10f7a0; --blue:#0ea5e9; --red:#ef4444;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,Arial,sans-serif}
  .wrap{max-width:900px;margin:0 auto;padding:20px}
  h1{font-size:40px;line-height:1.1;margin:8px 0 18px}
  .back{float:right;background:transparent;border:1px solid var(--border);color:var(--text);
        border-radius:12px;padding:10px 16px;cursor:pointer}
  .card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;border:1px solid var(--border)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .title{font-weight:800;font-size:20px}
  .small{font-size:12px;color:var(--muted);margin-top:4px}
  .badge{background:#1f2937;border:1px solid var(--border);padding:6px 10px;border-radius:10px}
  .empty{color:var(--muted);margin-top:8px}

  /* Modal (visualização) */
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;
                  align-items:center;justify-content:center;padding:20px;z-index:20}
  .modal{background:var(--card);border-radius:16px;max-width:760px;width:100%;
         max-height:92vh;overflow:auto;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.65)}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .modal-title{font-weight:800;font-size:18px}
  .x{background:transparent;border:1px solid var(--border);color:var(--text);
      border-radius:10px;height:36px;padding:0 10px;cursor:pointer}

  .btn{border:0;border-radius:12px;height:44px;padding:0 14px;font-weight:800;cursor:pointer}
  .btn-blue{background:var(--blue);color:#001018}
  .btn-green{background:var(--green);color:#001c14}
  .btn-red{background:#ef4444;color:#2c0000}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
  .bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}

  .preview-title{color:var(--muted);font-size:12px;margin:6px 0 4px}
  .preview{
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre;           /* 42 colunas exatas */
    line-height: 1.2;
    margin: 0;
    color: var(--text);
    background: transparent;
  }

  /* Editor de itens (segundo modal) */
  .editor-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;
                   align-items:center;justify-content:center;padding:20px;z-index:30}
  .editor{background:var(--card);border-radius:16px;max-width:820px;width:100%;
          max-height:92vh;overflow:auto;padding:16px;box-shadow:0 24px 60px rgba(0,0,0,.7)}
  .grid4{display:grid;grid-template-columns:2fr .8fr .8fr .9fr;gap:8px}
  .item-row{display:flex;gap:8px;align-items:flex-end;margin-bottom:6px}
  label{font-size:12px;color:var(--muted);display:block;margin-top:6px}
  input,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--border);
               background:#0b1220;color:var(--text);text-transform:uppercase}
  .sep{border-top:1px solid var(--border);margin:10px 0}
</style>
</head>
<body>
<div class="wrap">
  <button class="back" onclick="location.href='index.html'">Voltar ao menu</button>
  <h1>OS Arquivadas</h1>

  <div id="list"></div>
  <div id="empty" class="empty" style="display:none">Nenhuma OS arquivada ainda.</div>
</div>

<!-- Modal Visualização -->
<div class="modal-backdrop" id="backdrop">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title">Detalhes da OS</div>
      <button class="x" onclick="document.getElementById('backdrop').style.display='none'">Fechar</button>
    </div>

    <div class="bar">
      <button class="btn btn-blue"  id="btnReprint">Reimprimir</button>
      <button class="btn btn-green" id="btnDuplicate">Duplicar p/ Vendas</button>
      <button class="btn btn-ghost" id="btnEdit">Editar</button>
      <button class="btn btn-red"   id="btnDelete">Excluir</button>
    </div>

    <div class="preview-title">Pré-visualização (texto 80mm / 42 colunas)</div>
    <pre id="preview" class="preview"></pre>
  </div>
</div>

<!-- Modal Editor de Itens -->
<div class="editor-backdrop" id="editorBackdrop">
  <div class="editor">
    <div class="modal-head">
      <div class="modal-title">Editar itens da OS</div>
      <button class="x" onclick="fecharEditor()">Fechar</button>
    </div>

    <div id="editorForm"></div>

    <div class="sep"></div>
    <div style="display:flex; gap:10px; justify-content:flex-end">
      <button class="btn btn-ghost" onclick="fecharEditor()">Cancelar</button>
      <button class="btn btn-green" onclick="salvarEdicao()">Salvar alterações</button>
    </div>
  </div>
</div>

<script>
/* ========= Utilitários ========= */
const W = 42;
const money = v => (isNaN(v)?0:v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const pad2 = n => String(n).padStart(2,'0');
const padRight = (s,len)=>{ s=String(s||''); return s.length>len? s.slice(0,len): s + ' '.repeat(len-s.length); };
const center = (s,len)=>{ s=String(s||''); const L=Math.floor((len-s.length)/2); return ' '.repeat(L)+s+' '.repeat(len-s.length-L); };
function wrapLines(text, width){
  if (!text) return [];
  const words = String(text).split(/\s+/);
  const lines = []; let line='';
  words.forEach(w=>{
    if ((line + (line?' ':'') + w).length <= width) line += (line?' ':'') + w;
    else { if (line) lines.push(line); while(w.length>width){ lines.push(w.slice(0,width)); w=w.slice(width);} line=w; }
  });
  if (line) lines.push(line);
  return lines;
}
function parseMoney(str){
  if (str === '' || str == null) return 0;
  return parseFloat(String(str).replace(/\./g,'').replace(',','.')) || 0;
}

/* ========= Builder igual ao vendas.html ========= */
function buildOSFromRecord(rec){
  const out = [];
  out.push(center('IRMÃOS HARTMANN', W));
  out.push(center('ORDEM DE SERVIÇO', W));
  out.push('='.repeat(W));
  out.push(padRight(`DATA: ${rec.data || ''}`, W));
  out.push(padRight(`CLIENTE: ${String(rec.cliente||'').toUpperCase()}`, W));
  out.push(padRight(`PLACA: ${String(rec.placa||'').toUpperCase()}`, W));
  out.push(padRight(`PEDRA: ${String(rec.pedra||'').toUpperCase()}`, W));
  out.push('-'.repeat(W));
  out.push(padRight('PRODUTO:', W));
  out.push('');

  if (rec.obs){
    wrapLines('OBS: ' + String(rec.obs).toUpperCase(), W).forEach(l => out.push(padRight(l, W)));
    out.push('');
  }

  let soma = 0;
  (rec.itens||[]).forEach((it, idx)=>{
    const qtd   = Number(it.qtd||0);
    const unit  = Number(it.unit || it.valorUnitario || 0);
    const tipo  = it.tipo || 'CX';
    const nome  = String(it.produto||'').toUpperCase();

    const subtotal = qtd * unit;
    soma += subtotal;

    wrapLines(nome, W).forEach(l => out.push(padRight(l, W)));

    const esquerda = `QTD: ${String(qtd).replace('.',',')} ${tipo} R$ ${money(unit)}`;
    const direita  = `TOTAL: R$ ${money(subtotal)}`;
    const espacos  = W - esquerda.length - direita.length;
    out.push(esquerda + ' '.repeat(espacos > 0 ? espacos : 1) + direita);

    if (idx < (rec.itens.length-1)) out.push('');
  });

  out.push('-'.repeat(W));
  const totalNota = `TOTAL DA NOTA: R$ ${money(soma)}`;
  out.push(' '.repeat(Math.max(0, W - totalNota.length)) + totalNota);
  out.push('');
  out.push('Assinatura: __________________________');

  return out.join('\n');
}

/* ========= Se só há texto salvo, converte \n ========= */
function recordToPrintable(rec){
  if (Array.isArray(rec.itens) && rec.itens.length) return buildOSFromRecord(rec);
  const t = String(rec.texto || rec.preview || '');
  return t.replace(/\\n/g, '\n');
}

/* ========= Lista ========= */
let data = [];
let currentIndex = -1;

function renderList(){
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  list.innerHTML = '';

  data.forEach((rec, i)=>{
    const div = document.createElement('div');
    div.className = 'card';
    const total = rec.total ?? (rec.itens||[]).reduce((s,it)=>s + (Number(it.qtd||0)*Number(it.unit||it.valorUnitario||0)),0);
    div.innerHTML = `
      <div class="row">
        <div>
          <div class="title">${(rec.cliente||'').toUpperCase()}</div>
          <div class="small">${rec.data ? rec.data : ''}</div>
        </div>
        <div class="badge">TOTAL: R$ ${money(total)}</div>
      </div>
    `;
    div.onclick = ()=>openModal(i);
    list.appendChild(div);
  });

  empty.style.display = data.length ? 'none' : 'block';
}

/* ========= Modal Visualização ========= */
function openModal(i){
  currentIndex = i;
  const rec = data[i];
  document.getElementById('preview').textContent = recordToPrintable(rec);
  document.getElementById('backdrop').style.display = 'flex';
}

/* ========= Ações do modal ========= */
async function shareText(text){
  if (navigator.share){
    try { await navigator.share({ text, title:'OS Hartmann' }); }
    catch(e){}
  }else{
    try{ await navigator.clipboard.writeText(text); alert('OS copiada! Abra o app da impressora e cole.'); }
    catch(e){ alert('Selecione e copie manualmente da prévia.'); }
  }
}

document.getElementById('btnReprint').onclick = async ()=>{
  if (currentIndex<0) return;
  const txt = recordToPrintable(data[currentIndex]);
  await shareText(txt);
};
document.getElementById('btnDelete').onclick = ()=>{
  if (currentIndex<0) return;
  if (!confirm('Excluir esta OS?')) return;
  data.splice(currentIndex,1);
  localStorage.setItem('os_arquivadas', JSON.stringify(data));
  renderList();
  document.getElementById('backdrop').style.display='none';
};
document.getElementById('btnDuplicate').onclick = ()=>{
  if (currentIndex<0) return;
  localStorage.setItem('duplicar_para_vendas', JSON.stringify(data[currentIndex]));
  location.href = 'vendas.html';
};

/* ========= EDITOR DE ITENS ========= */
document.getElementById('btnEdit').onclick = abrirEditor;

function abrirEditor(){
  if (currentIndex<0) return;
  const rec = data[currentIndex];
  // garante estrutura de itens
  if (!Array.isArray(rec.itens)) rec.itens = [];

  const form = document.getElementById('editorForm');
  form.innerHTML = '';

  rec.itens.forEach((it, idx)=>{
    const row = document.createElement('div');
    row.className = 'grid4';
    row.style.marginBottom = '8px';
    row.innerHTML = `
      <div>
        <label>Produto</label>
        <input type="text" data-k="produto" data-i="${idx}" value="${(it.produto||'').toString().toUpperCase()}">
      </div>
      <div>
        <label>Tipo</label>
        <select data-k="tipo" data-i="${idx}">
          <option ${ (it.tipo||'')==='CX'?'selected':'' } value="CX">CX</option>
          <option ${ (it.tipo||'')==='KG'?'selected':'' } value="KG">KG</option>
          <option ${ (it.tipo||'')==='UN'?'selected':'' } value="UN">UN</option>
        </select>
      </div>
      <div>
        <label>Qtd</label>
        <input type="number" step="0.01" inputmode="decimal" data-k="qtd" data-i="${idx}" value="${Number(it.qtd||0)}">
      </div>
      <div>
        <label>V. Unitário</label>
        <input type="text" inputmode="numeric" data-k="unit" data-i="${idx}" value="${money(Number(it.unit||it.valorUnitario||0)).replace('.',',')}">
      </div>
    `;
    form.appendChild(row);
  });

  document.getElementById('editorBackdrop').style.display = 'flex';
}

function fecharEditor(){
  document.getElementById('editorBackdrop').style.display = 'none';
}

function salvarEdicao(){
  if (currentIndex<0) return;
  const rec = data[currentIndex];
  const inputs = document.querySelectorAll('#editorForm input, #editorForm select');

  inputs.forEach(el=>{
    const i = Number(el.getAttribute('data-i'));
    const k = el.getAttribute('data-k');
    if (!rec.itens[i]) rec.itens[i] = { produto:'', tipo:'CX', qtd:0, unit:0 };
    if (k === 'unit'){
      rec.itens[i][k] = parseMoney(el.value);
    } else if (k === 'qtd'){
      rec.itens[i][k] = parseFloat(el.value || '0') || 0;
    } else {
      rec.itens[i][k] = (el.value || '').toString().toUpperCase();
    }
  });

  // limpa qualquer campo antigo
  rec.total = undefined;

  // atualiza preview e persiste
  localStorage.setItem('os_arquivadas', JSON.stringify(data));
  document.getElementById('preview').textContent = buildOSFromRecord(rec);
  fecharEditor();
}

/* ========= Carrega dados ========= */
(function load(){
  let d = [];
  try {
    d = JSON.parse(localStorage.getItem('os_arquivadas') || '[]');
    if (!d.length){
      d = JSON.parse(localStorage.getItem('arquivados') || '[]');
      if (Array.isArray(d) && d.length){
        localStorage.setItem('os_arquivadas', JSON.stringify(d));
        localStorage.removeItem('arquivados');
      }
    }
  } catch(e){ d = []; }
  data = Array.isArray(d) ? d : [];
  renderList();
})();
</script>
</body>
</html>
