<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>OS Arquivadas — Irmãos Hartmann</title>
<style>
  :root{
    --bg:#0f172a; --card:#111827; --text:#e5e7eb; --muted:#9ca3af;
    --border:#2c3448; --green:#10f7a0; --orange:#f59e0b; --blue:#0ea5e9; --red:#ef4444;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,Arial,sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:20px}
  .topbar{display:flex;justify-content:flex-end;margin-bottom:6px}
  .link-top{font-size:14px;color:#9bd3ff;text-decoration:none;padding:6px 10px;border-radius:10px;border:1px solid var(--border)}
  h1{margin:8px 0 14px}
  .os-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin:12px 0;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .os-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .total-chip{border:1px solid var(--border);border-radius:12px;padding:6px 10px;color:#d1fae5;background:#064e3b22}
  .muted{color:var(--muted)}
  .btn{height:44px;border-radius:12px;border:0;padding:0 14px;font-weight:800;cursor:pointer}
  .btn-blue{background:var(--blue);color:#001018}
  .btn-red{background:var(--red);color:#2b0a0a}
  .btn-green{background:var(--green);color:#001c14}
  .btn-outline{background:transparent;color:var(--text);border:2px solid var(--border)}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}

  /* Modal DETALHES */
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
  .modal{background:var(--card);border-radius:16px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.65)}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .x{background:transparent;border:1px solid var(--border);color:var(--text);border-radius:10px;height:36px;padding:0 10px;cursor:pointer}

  .preview-title{color:var(--muted);font-size:12px;margin-top:10px}
  .preview{
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre-wrap; word-break: break-word; line-height:1.2;
    margin: 6px 0 0; color: var(--text); background: transparent; padding: 0; border: 0;
  }

  /* Modal EDIÇÃO */
  .edit-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:30}
  .edit-modal{background:var(--card);border-radius:16px;max-width:820px;width:100%;max-height:92vh;overflow:auto;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.75)}
  label{font-size:14px;color:var(--muted);margin-top:10px;display:block}
  input,select,textarea{
    width:100%;padding:10px;border-radius:10px;border:1px solid var(--border);
    background:#0b1220;color:var(--text);margin-top:5px;margin-bottom:10px;
  }
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .itens-list{display:flex;flex-direction:column;gap:8px}
  .item-card{border:1px solid var(--border);border-radius:12px;padding:10px}
  .item-head{display:flex;justify-content:space-between;gap:10px;align-items:center}
  .small-btns{display:flex;gap:8px}
  .small-btn{height:36px;padding:0 12px;border-radius:10px;font-weight:800;border:0;cursor:pointer}
  .small-green{background:var(--green);color:#001c14}
  .small-outline{background:transparent;color:var(--text);border:2px solid var(--border)}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="link-top" href="menu.html">Voltar ao menu</a>
  </div>

  <h1>OS Arquivadas</h1>
  <div id="lista"></div>
</div>

<!-- Modal DETALHES -->
<div id="backdrop" class="backdrop">
  <div class="modal">
    <div class="modal-head">
      <div style="font-weight:800">Detalhes da OS</div>
      <button class="x" id="fechar">Fechar</button>
    </div>

    <div class="row" style="margin-top:0">
      <button class="btn btn-green" id="btnReprint">Reimprimir</button>
      <button class="btn btn-blue"  id="btnDuplicate">Duplicar p/ Vendas</button>
      <button class="btn btn-outline" id="btnEdit">Editar</button>
      <button class="btn btn-red" id="btnDelete">Excluir</button>
    </div>

    <div class="preview-title">Pré-visualização (texto 80mm / 42 colunas)</div>
    <pre id="preview" class="preview"></pre>
  </div>
</div>

<!-- Modal EDIÇÃO -->
<div id="editBackdrop" class="edit-backdrop">
  <div class="edit-modal">
    <div class="modal-head">
      <div style="font-weight:800">Editar OS</div>
      <button class="x" id="fecharEdit">Fechar</button>
    </div>

    <div class="row2">
      <div>
        <label>Cliente</label>
        <input type="text" id="eCliente" />
      </div>
      <div>
        <label>Placa</label>
        <input type="text" id="ePlaca" />
      </div>
    </div>
    <div class="row2">
      <div>
        <label>Pedra</label>
        <input type="number" id="ePedra" inputmode="numeric" />
      </div>
      <div>
        <label>Observações</label>
        <input type="text" id="eObs" />
      </div>
    </div>

    <label>Itens</label>
    <div id="itensList" class="itens-list"></div>

    <div id="editorItem" style="margin-top:12px;display:none">
      <label>Produto</label>
      <input type="text" id="iProduto" />
      <div class="row2">
        <div>
          <label>Tipo</label>
          <select id="iTipo">
            <option value="CX">CX</option>
            <option value="KG">KG</option>
            <option value="UN">UN</option>
          </select>
        </div>
        <div>
          <label>Quantidade</label>
          <input type="number" id="iQtd" step="0.01" inputmode="decimal" />
        </div>
      </div>
      <div>
        <label>V. Unitário</label>
        <input type="text" id="iUnit" inputmode="numeric" placeholder="0,00" />
      </div>
      <div class="row" style="margin-top:6px">
        <button class="btn btn-green" id="btnSalvarItem">Salvar item</button>
        <button class="btn btn-outline" id="btnCancelarItem">Cancelar</button>
      </div>
    </div>

    <div class="row" style="margin-top:10px">
      <button class="btn btn-green" id="btnSalvarOS">Salvar alterações da OS</button>
    </div>
  </div>
</div>

<script>
/* ===== Utils ===== */
const $ = s => document.querySelector(s);
const W = 42;
const money = v => (isNaN(v)?0:v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const pad2 = n => String(n).padStart(2,'0');
const padRight = (s,len)=>{ s=String(s||''); return s.length>len? s.slice(0,len): s + ' '.repeat(len-s.length); };
const center = (s,len)=>{ s=String(s||''); const L=Math.floor((len-s.length)/2); return ' '.repeat(L)+s+' '.repeat(len-s.length-L); };
function wrapLines(text, width){
  if (!text) return [];
  const words = String(text).split(/\s+/);
  const lines = []; let line='';
  for (let w of words){
    if ((line + (line?' ':'') + w).length <= width) line += (line?' ':'') + w;
    else { if (line) lines.push(line); while (w.length>width){ lines.push(w.slice(0,width)); w=w.slice(width);} line=w; }
  }
  if (line) lines.push(line);
  return lines;
}
function formatDate(ts){
  if (!ts) return '';
  const d = new Date(ts);
  return `${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${d.getFullYear()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}
function parseNumBR(str){
  if (str===null||str===undefined) return 0;
  return parseFloat(String(str).replace('.','').replace(',','.'))||0;
}
function maskMoneyInput(el){
  let val = el.value.replace(/\D/g,'');
  val = (parseInt(val || '0',10)/100).toFixed(2);
  el.value = val.replace('.',',');
}

/* ===== Dados ===== */
let data = [];
let currentIndex = -1; // índice aberto no DETALHES
let editIndex = -1;    // índice do item no modal EDIÇÃO

(function migrateKeys(){
  const legacy = localStorage.getItem('osArquivadas');
  if (legacy && !localStorage.getItem('os_arquivadas')) {
    localStorage.setItem('os_arquivadas', legacy);
    localStorage.removeItem('osArquivadas');
  }
})();
function loadData(){
  try{ data = JSON.parse(localStorage.getItem('os_arquivadas')||'[]'); }
  catch{ data = []; }
}
function saveData(){
  localStorage.setItem('os_arquivadas', JSON.stringify(data));
}

/* ===== Lista ===== */
function renderList(){
  const list = $('#lista');
  list.innerHTML = '';
  if (!data.length){
    list.innerHTML = '<div class="os-card muted">Nenhuma OS arquivada ainda.</div>';
    return;
  }
  data.forEach((rec, i)=>{
    let total = 0;
    if (typeof rec.total === 'number') total = rec.total;
    else if (rec.texto) {
      const m = String(rec.texto).match(/TOTAL DA NOTA:\s*R\$\s*([\d.,]+)/i);
      if (m) total = parseFloat(m[1].replace('.','').replace(',','.'))||0;
    } else if (Array.isArray(rec.itens)){
      total = rec.itens.reduce((s,it)=> s + (parseFloat(it.qtd)||0)*(parseFloat(it.unit)||0), 0);
    }
    const card = document.createElement('div');
    card.className = 'os-card';
    card.innerHTML = `
      <div class="os-head">
        <div><strong>${(rec.cliente||'').toUpperCase()}</strong><div class="muted" style="font-size:12px">${formatDate(rec.createdAt)}</div></div>
        <div class="total-chip">TOTAL: R$ ${money(total)}</div>
      </div>
      <div class="row">
        <button class="btn btn-blue" onclick="openModal(${i})">Ver detalhes</button>
      </div>
    `;
    list.appendChild(card);
  });
}

/* ===== Texto 80mm ===== */
/* Agora aceita preferRebuild=true para forçar reconstrução após edição */
function buildOSFromRecord(rec, preferRebuild=false){
  // Se preferRebuild for false e já existir texto salvo, usa-o.
  if (!preferRebuild && rec && typeof rec.texto === 'string' && rec.texto.trim()) {
    return rec.texto;
  }

  const d = rec.createdAt ? new Date(rec.createdAt) : new Date();
  const dataStr = `${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${d.getFullYear()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  const cliente = String(rec.cliente||'').toUpperCase();
  const placa   = String(rec.placa||'').toUpperCase();
  const pedra   = String(rec.pedra||'').toUpperCase();
  const obs     = String(rec.obs||'').trim().toUpperCase();

  const out = [];
  out.push(center('IRMAOS HARTMANN', W));
  out.push(center('ORDEM DE SERVICO', W));
  out.push('='.repeat(W));
  out.push(padRight(`DATA: ${dataStr}`, W));
  out.push(padRight(`CLIENTE: ${cliente}`, W));
  out.push(padRight(`PLACA: ${placa}`, W));
  out.push(padRight(`PEDRA: ${pedra}`, W));
  out.push('-'.repeat(W));
  out.push(padRight('PRODUTO:', W));
  out.push('');

  if (obs){
    wrapLines('OBS: ' + obs, W).forEach(l => out.push(padRight(l, W)));
    out.push('');
  }

  let soma = 0;
  const itens = Array.isArray(rec.itens) ? rec.itens : [];
  itens.forEach((it, idx)=>{
    const qtd  = parseFloat(it.qtd)||0;
    const unit = parseFloat(it.unit)||0;
    const tipo = (it.tipo||'').toUpperCase();
    const nome = String(it.produto||'').toUpperCase();
    const subtotal = qtd*unit;
    soma += subtotal;

    wrapLines(nome, W).forEach(l => out.push(padRight(l, W)));
    const esquerda = `QTD: ${String(qtd).replace('.',',')} ${tipo} R$ ${money(unit)}`;
    const direita  = `TOTAL: R$ ${money(subtotal)}`;
    const espacos  = W - esquerda.length - direita.length;
    out.push(esquerda + ' '.repeat(espacos>0?espacos:1) + direita);

    if (idx < itens.length-1) out.push('');
  });

  out.push('-'.repeat(W));
  const totalNota = `TOTAL DA NOTA: R$ ${money(soma)}`;
  out.push(' '.repeat(Math.max(0, W - totalNota.length)) + totalNota);
  out.push('');
  out.push('Assinatura: __________________________');

  // Se não tiver itens e tiver texto antigo, retorna o antigo
  const built = out.join('\n');
  if (!itens.length && rec.texto && !preferRebuild) return rec.texto;
  return built;
}
function recordToPrintable(rec){
  const txt = (rec && typeof rec.texto === 'string' && rec.texto.trim())
    ? rec.texto
    : buildOSFromRecord(rec, true);
  return String(txt).replace(/\\n/g, '\n');
}

/* ===== Modal DETALHES ===== */
function openModal(i){
  currentIndex = i;
  $('#preview').textContent = recordToPrintable(data[i]);
  $('#backdrop').style.display = 'flex';
}
$('#fechar').onclick = () => { $('#backdrop').style.display = 'none'; };

/* ===== Impressão COM LOGO ===== */
function loadImage(src){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=>resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}
async function printWithLogo(texto){
  try{
    const img = await loadImage('img/logo-hartmann.png');
    const Wpx = 576, fontSize=20, lineH=26, topPad=20, between=16;
    const lines = String(texto).split('\n');
    const scale = Math.min((Wpx*0.8)/img.width, 1);
    const logoW = Math.round(img.width*scale), logoH = Math.round(img.height*scale);
    const canvas = document.createElement('canvas');
    canvas.width=Wpx; canvas.height = topPad + logoH + between + lines.length*lineH + 20;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
    const logoX = Math.round((Wpx-logoW)/2);
    ctx.drawImage(img, logoX, topPad, logoW, logoH);
    ctx.fillStyle='#000'; ctx.font = `${fontSize}px Consolas, Menlo, monospace`;
    let y = topPad + logoH + between + fontSize;
    for (const line of lines){
      const m = ctx.measureText(line);
      const x = Math.max(0, Math.round((Wpx - m.width)/2));
      ctx.fillText(line, x, y);
      y += lineH;
    }
    const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
    if (blob){
      const file = new File([blob], 'os.png', { type:'image/png' });
      if (navigator.share && navigator.canShare && navigator.canShare({ files:[file] })){
        try{ await navigator.share({ files:[file], title:'OS Hartmann' }); return; }catch(e){}
      }
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank'); return;
    }
  }catch(e){}
  if (navigator.share){ try{ await navigator.share({ text:texto, title:'OS Hartmann' }); return; }catch(e){} }
  try{ await navigator.clipboard.writeText(texto); alert('OS copiada! Abra o app de impressão e cole.'); }
  catch{ alert('Selecione e copie manualmente o texto da prévia.'); }
}

/* ===== Ações do DETALHES ===== */
$('#btnReprint').onclick = async ()=>{
  if (currentIndex<0) return;
  // garante usar o texto reconstruído mais recente
  const rec = data[currentIndex];
  rec.texto = buildOSFromRecord(rec, true);
  saveData();
  $('#preview').textContent = recordToPrintable(rec);
  await printWithLogo(recordToPrintable(rec));
};
$('#btnDuplicate').onclick = ()=>{
  if (currentIndex<0) return;
  localStorage.setItem('duplicar_para_vendas', JSON.stringify(data[currentIndex]));
  location.href = 'vendas.html';
};
$('#btnEdit').onclick = ()=>{
  if (currentIndex<0) return;
  openEditModal(currentIndex);
};
$('#btnDelete').onclick = ()=>{
  if (currentIndex<0) return;
  if (!confirm('Excluir esta OS?')) return;
  data.splice(currentIndex,1);
  saveData();
  $('#backdrop').style.display='none';
  renderList();
};

/* ===== Modal EDIÇÃO ===== */
function fillEditForm(rec){
  $('#eCliente').value = rec.cliente || '';
  $('#ePlaca').value   = rec.placa   || '';
  $('#ePedra').value   = rec.pedra   || '';
  $('#eObs').value     = rec.obs     || '';
}
function renderItensList(rec){
  const box = $('#itensList');
  box.innerHTML = '';
  const itens = Array.isArray(rec.itens) ? rec.itens : [];
  if (!itens.length){
    const div = document.createElement('div');
    div.className = 'item-card';
    div.textContent = 'Nenhum item nesta OS.';
    box.appendChild(div);
    return;
  }
  itens.forEach((it, i)=>{
    const card = document.createElement('div');
    card.className = 'item-card';
    const head = document.createElement('div');
    head.className = 'item-head';

    const titulo = document.createElement('div');
    const subtotal = (parseFloat(it.qtd)||0) * (parseFloat(it.unit)||0);
    titulo.innerHTML = `<b>${(it.produto||'').toUpperCase()}</b><br>
      <span class="muted">QTD: ${String(it.qtd).replace('.',',')} ${(it.tipo||'').toUpperCase()} — V.UNIT: R$ ${money(it.unit)} — TOTAL: R$ ${money(subtotal)}</span>`;

    const btns = document.createElement('div');
    btns.className = 'small-btns';

    const bEdit = document.createElement('button');
    bEdit.className = 'small-btn small-green';
    bEdit.textContent = 'Editar';
    bEdit.onclick = ()=>{
      editIndex = i;
      $('#editorItem').style.display='block';
      $('#iProduto').value = (it.produto||'').toUpperCase();
      $('#iTipo').value    = (it.tipo||'CX').toUpperCase();
      $('#iQtd').value     = it.qtd || 0;
      $('#iUnit').value    = (parseFloat(it.unit)||0).toFixed(2).replace('.',',');
      $('#iProduto').focus();
    };

    const bRem = document.createElement('button');
    bRem.className = 'small-btn small-outline';
    bRem.textContent = 'Remover';
    bRem.onclick = ()=>{
      rec.itens.splice(i,1);
      // ao remover item, já reconstrói texto, salva e atualiza tudo
      rec.texto = buildOSFromRecord(rec, true);
      saveData();
      renderItensList(rec);
      renderList();
      // se modal de detalhes estiver aberto, atualiza a prévia
      $('#preview').textContent = recordToPrintable(rec);
    };

    btns.appendChild(bEdit);
    btns.appendChild(bRem);
    head.appendChild(titulo);
    head.appendChild(btns);
    card.appendChild(head);
    box.appendChild(card);
  });
}
function openEditModal(i){
  currentIndex = i;
  const rec = data[i];
  fillEditForm(rec);
  renderItensList(rec);
  $('#editorItem').style.display='none';
  $('#backdrop').style.display='none';
  $('#editBackdrop').style.display='flex';
}
$('#fecharEdit').onclick = ()=>{ $('#editBackdrop').style.display='none'; };

/* máscara de dinheiro no editor de item */
$('#iUnit').addEventListener('input', e => maskMoneyInput(e.target));

/* salvar item */
$('#btnSalvarItem').onclick = ()=>{
  if (currentIndex<0 || editIndex<0) return;
  const rec = data[currentIndex];
  if (!Array.isArray(rec.itens)) rec.itens = [];
  rec.itens[editIndex] = {
    produto: ($('#iProduto').value||'').toUpperCase(),
    tipo:     $('#iTipo').value,
    qtd:      parseFloat($('#iQtd').value)||0,
    unit:     parseNumBR($('#iUnit').value)
  };
  editIndex = -1;
  $('#editorItem').style.display='none';

  // **FORÇA RECONSTRUIR TEXTO APÓS EDIÇÃO**
  rec.texto = buildOSFromRecord(rec, true);
  saveData();

  renderItensList(rec);
  renderList();

  // Reabre/atualiza Detalhes com a versão nova
  $('#preview').textContent = recordToPrintable(rec);
  $('#backdrop').style.display = 'flex';
  $('#editBackdrop').style.display='none';
};

/* cancelar item */
$('#btnCancelarItem').onclick = ()=>{
  editIndex = -1;
  $('#editorItem').style.display='none';
};

/* salvar OS (cabeçalho) */
$('#btnSalvarOS').onclick = ()=>{
  if (currentIndex<0) return;
  const rec = data[currentIndex];
  rec.cliente = ($('#eCliente').value||'').toUpperCase();
  rec.placa   = ($('#ePlaca').value||'').toUpperCase();
  rec.pedra   = ($('#ePedra').value||'').toString().toUpperCase();
  rec.obs     = ($('#eObs').value||'').toUpperCase();

  // **FORÇA RECONSTRUIR TEXTO APÓS EDIÇÃO**
  rec.texto = buildOSFromRecord(rec, true);
  saveData();

  renderList();
  $('#preview').textContent = recordToPrintable(rec);
  $('#backdrop').style.display = 'flex';
  $('#editBackdrop').style.display='none';
};

/* ===== Modal DETALHES: ações ===== */
$('#btnReprint').onclick = async ()=>{
  if (currentIndex<0) return;
  const rec = data[currentIndex];
  rec.texto = buildOSFromRecord(rec, true);
  saveData();
  $('#preview').textContent = recordToPrintable(rec);
  await printWithLogo(recordToPrintable(rec));
};
$('#btnDuplicate').onclick = ()=>{
  if (currentIndex<0) return;
  localStorage.setItem('du
