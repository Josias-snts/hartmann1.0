<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>OS Arquivadas — Irmãos Hartmann</title>
<style>
  :root{
    --bg:#0f172a; --card:#111827; --text:#e5e7eb; --muted:#9ca3af;
    --border:#2c3448; --green:#10f7a0; --blue:#0ea5e9; --red:#ef4444;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,Arial,sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:20px}
  h1{font-size:42px;line-height:1.05;margin:10px 0 16px}
  .topbar{display:flex;justify-content:flex-end;margin-bottom:8px}
  .link-top{font-size:14px;color:#9bd3ff;text-decoration:none;padding:8px 12px;border-radius:12px;border:1px solid var(--border)}
  .os-card{
    background:var(--card); border:1px solid var(--border); border-radius:16px;
    padding:16px; margin:10px 0; cursor:pointer;
  }
  .os-card:hover{outline:1px solid #28405e}
  .os-head{display:flex; justify-content:space-between; align-items:center; gap:10px}
  .os-title{font-weight:800; font-size:20px}
  .pill{background:#0b2236;border:1px solid var(--border); padding:6px 10px; border-radius:999px; font-weight:800}
  .muted{color:var(--muted);font-size:14px;margin-top:6px}

  /* Modal */
  .modal-backdrop{position:fixed; inset:0; background:rgba(0,0,0,.45); display:none;
    align-items:center; justify-content:center; padding:20px; z-index:20;}
  .modal{background:var(--card); border-radius:16px; max-width:760px; width:100%;
    max-height:92vh; overflow:auto; padding:16px; box-shadow:0 20px 60px rgba(0,0,0,.65);}
  .modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px}
  .modal-title{font-weight:800; font-size:20px}
  .x{background:transparent; border:1px solid var(--border); color:var(--text); border-radius:12px;
    height:36px; padding:0 10px; cursor:pointer}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin:8px 0 6px}
  .btn{height:48px; border-radius:14px; border:0; font-weight:800; cursor:pointer}
  .btn-blue{background:var(--blue); color:#001018}
  .btn-green{background:var(--green); color:#001c14}
  .btn-red{background:var(--red); color:#1f0a0a}
  .btn-ghost{background:transparent; color:var(--text); border:1px solid var(--border)}
  .sep{border-top:1px solid var(--border); margin:10px 0}
  .preview-title{color:var(--muted); font-size:12px; margin:6px 0}
  .preview{
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre-wrap; word-break: break-word; line-height: 1.2;
    margin: 0; color: var(--text); background: transparent; padding: 0; border: 0;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="link-top" href="menu.html">Voltar ao menu</a>
  </div>

  <h1>OS Arquivadas</h1>

  <div id="list"></div>
  <div id="empty" class="muted" style="display:none">Nenhuma OS arquivada ainda.</div>
</div>

<!-- Modal Detalhes -->
<div id="backdrop" class="modal-backdrop">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title">Detalhes da OS</div>
      <button class="x" id="btnClose">Fechar</button>
    </div>

    <div class="row3">
      <button class="btn btn-blue"  id="btnReprint">Reimprimir</button>
      <button class="btn btn-green" id="btnDuplicate">Duplicar p/ Vendas</button>
      <button class="btn btn-ghost" id="btnEdit">Editar</button>
    </div>
    <button class="btn btn-red" id="btnDelete" style="width:100%;margin-bottom:8px">Excluir</button>

    <div class="sep"></div>
    <div class="preview-title">Pré-visualização (texto 80mm / 42 colunas)</div>
    <pre id="preview" class="preview"></pre>
  </div>
</div>

<script>
/* ========= Utils ========= */
const $ = s => document.querySelector(s);
const money = v => (isNaN(v)?0:v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const pad2 = n => String(n).padStart(2,'0');

/* ========= Builder com 42 colunas, igual vendas.html ========= */
const W = 42;
const padRight = (s,len)=>{ s=String(s||''); return s.length>len? s.slice(0,len): s + ' '.repeat(len-s.length); };
const center   = (s,len)=>{ s=String(s||''); const L=Math.floor((len-s.length)/2); return ' '.repeat(L)+s+' '.repeat(len-s.length-L); };
function wrapLines(text, width){
  if (!text) return [];
  const words = String(text).split(/\s+/);
  const lines = []; let line='';
  words.forEach(w=>{
    if ((line + (line?' ':'') + w).length <= width) line += (line?' ':'') + w;
    else { if (line) lines.push(line); while(w.length>width){ lines.push(w.slice(0,width)); w=w.slice(width);} line=w; }
  });
  if (line) lines.push(line);
  return lines;
}

/* Constrói texto a partir do record (preferindo itens) */
function buildOSFromRecord(rec){
  const d = rec.createdAt ? new Date(rec.createdAt) : new Date();
  const data = `${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${d.getFullYear()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;

  const cliente = String(rec.cliente||'').toUpperCase();
  const placa   = String(rec.placa||'').toUpperCase();
  const pedra   = String(rec.pedra||'').toUpperCase();
  const obs     = String(rec.obs||'').trim().toUpperCase();

  const out = [];
  out.push(center('IRMAOS HARTMANN', W));
  out.push(center('ORDEM DE SERVICO', W));
  out.push('='.repeat(W));
  out.push(padRight(`DATA: ${data}`, W));
  out.push(padRight(`CLIENTE: ${cliente}`, W));
  out.push(padRight(`PLACA: ${placa}`, W));
  out.push(padRight(`PEDRA: ${pedra}`, W));
  out.push('-'.repeat(W));
  out.push(padRight('PRODUTO:', W));
  out.push('');

  if (obs){
    wrapLines('OBS: ' + obs, W).forEach(l => out.push(padRight(l, W)));
    out.push('');
  }

  let soma = 0;
  if (Array.isArray(rec.itens)) {
    rec.itens.forEach((it, idx)=>{
      const nome = String(it.produto||'').toUpperCase();
      const tipo = String(it.tipo||'').toUpperCase();
      const qtd  = it.qtd ?? 0;
      const unit = it.unit ?? it.valorUnitario ?? 0;
      const subtotal = Number(qtd)*Number(unit);
      soma += subtotal;

      wrapLines(nome, W).forEach(l => out.push(padRight(l, W)));

      const esquerda = `QTD: ${String(qtd).replace('.',',')} ${tipo} R$ ${money(unit)}`;
      const direita  = `TOTAL: R$ ${money(subtotal)}`;
      const espacos  = W - esquerda.length - direita.length;
      out.push(esquerda + ' '.repeat(espacos>0?espacos:1) + direita);

      if (idx < rec.itens.length - 1) out.push('');
    });
  }

  out.push('-'.repeat(W));
  const totalNota = `TOTAL DA NOTA: R$ ${money(soma)}`;
  out.push(' '.repeat(Math.max(0, W - totalNota.length)) + totalNota);
  out.push('');
  out.push('Assinatura: __________________________');

  return out.join('\n');
}

/* Quando não houver itens, reaproveita o texto salvo (e normaliza \n) */
function recordToPrintable(rec){
  if (Array.isArray(rec.itens) && rec.itens.length) return buildOSFromRecord(rec);
  const t = String(rec.texto||'');
  return t.replace(/\\n/g, '\n'); // normaliza aspas escapadas
}

/* ========= Estado / render ========= */
let data = [];
let currentIndex = -1;

function renderList(){
  const list = $('#list');
  const empty = $('#empty');
  list.innerHTML = '';
  if (!data.length) {
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  data.forEach((rec, i)=>{
    const card = document.createElement('div');
    card.className = 'os-card';

    const total = (Array.isArray(rec.itens) ? rec.itens.reduce((s,it)=>s+(Number(it.qtd||0)*Number((it.unit??it.valorUnitario)||0)),0) : 0);

    card.innerHTML = `
      <div class="os-head">
        <div class="os-title">${(rec.cliente||'').toUpperCase()}</div>
        <div class="pill">TOTAL: R$ ${money(total)}</div>
      </div>
      <div class="muted">${rec.createdAt ? new Date(rec.createdAt).toLocaleString() : ''}</div>
    `;
    card.onclick = ()=> openModal(i);
    list.appendChild(card);
  });
}

function openModal(i){
  currentIndex = i;
  const rec = data[i];
  $('#preview').textContent = recordToPrintable(rec);
  $('#backdrop').style.display = 'flex';
}

/* ========= Ações modal ========= */
$('#btnClose').onclick = ()=> $('#backdrop').style.display='none';

$('#btnReprint').onclick = async ()=>{
  if (currentIndex<0) return;
  const texto = recordToPrintable(data[currentIndex]);
  printWithLogo(texto);
};

$('#btnDelete').onclick = ()=>{
  if (currentIndex<0) return;
  if (!confirm('Excluir esta OS?')) return;
  data.splice(currentIndex,1);
  localStorage.setItem('os_arquivadas', JSON.stringify(data));
  $('#backdrop').style.display='none';
  renderList();
};

$('#btnDuplicate').onclick = ()=>{
  if (currentIndex<0) return;
  localStorage.setItem('duplicar_para_vendas', JSON.stringify(data[currentIndex]));
  location.href = 'vendas.html';
};

$('#btnEdit').onclick = ()=>{
  if (currentIndex<0) return;
  localStorage.setItem('editar_os', JSON.stringify(data[currentIndex]));
  location.href = 'vendas.html';
};

/* ========= Impressão com LOGO (não aparece na prévia) ========= */
function printWithLogo(previewText){
  const w = window.open('', '', 'width=800,height=600');
  w.document.write(`<!DOCTYPE html>
<html><head><meta charset="utf-8">
<title>Impressão OS</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;margin:10px}
  .logo{ text-align:center; margin-bottom:10px; }
  .logo img{ max-width:160px; }
  pre{ white-space:pre-wrap; font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:12px; line-height:1.25; }
</style>
</head>
<body>
  <div class="logo">
    <img src="img/logo-hartmann.png" alt="Logo Irmãos Hartmann">
  </div>
  <pre>${previewText.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</pre>
</body></html>`);
  w.document.close();
  // Aguarda o carregamento da imagem para imprimir com a logo
  w.onload = ()=> w.print();
}

/* ========= Load / Migração básica ========= */
function migrateIfNeeded(list){
  // Garante que sempre seja array
  if (!Array.isArray(list)) return [];
  return list.map(x=>{
    // Normaliza campos esperados
    const rec = {...x};
    if (!Array.isArray(rec.itens) && typeof rec.texto === 'string'){
      // mantém como está; printable usará texto normalizado
    }
    return rec;
  });
}

(function init(){
  try{
    const raw = JSON.parse(localStorage.getItem('os_arquivadas')||'[]');
    data = migrateIfNeeded(raw);
  }catch{ data = []; }
  renderList();
})();
</script>
</body>
</html>
